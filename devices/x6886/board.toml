name = "x6886"
description = "Infinix Hot 60 Pro+ X6886"
soc = "mt6789"

features = ["ufs"]

[loader]
# XNU's window must hold the whole APFS system image (load_system_image() has no size
# clamp). Base 5 GiB + 0xff600000 ends at 0x23f600000, 0x9ffff below the top of DRAM
# (0x23ffdffff) -- clear of ATF/LK's reserved top pages. The old 0xC0000000+0x30000000
# window was only 768 MB and silently overran everything when the ~4 GB image was read.
xnu_base = 0x140000000
xnu_size = 0x0ff600000
# /proc/iomem on X6886 reports "40010000-... : Kernel code": LK puts the Image at
# 0x40010000, not the MT6768/X6826B value 0x40080000. The loader is linked here and
# every PC-relative symbol (xnu_return_stub, BSS stacks) depends on it.
kernel_load = 0x40010000
chain_stub = 0x40010000
marker = 0x80000000
panic_log = 0x80100000
panic_log_size = 0x100000
scratch = 0x80400000
test_buffer = 0x80700000
core_order = [0, 6, 7, 1, 2, 3, 4, 5]
system_partition = "xnusys"

[ramoops]
# Proved from the cmdline + fs/pstore/ram.c zone order (dmesg -> console -> ftrace
# -> pmsg) in 0xe0000 @ 0x48090000: dmesg 0x20000, console 0x40000 at 0x480b0000,
# pmsg 0x80000 at 0x480f0000, ending exactly at 0x48170000. ECC is off. The old
# values put console at the region base (dmesg) and pmsg inside the console zone,
# which is why 30 flashes produced no log. Framebuffer banner stays primary.
console = 0x480b0000
console_size = 0x40000
pmsg = 0x480f0000
pmsg_size = 0x80000

[display]
fb_base = 0xfe0c0000
# Proved from atag,videolfb: 3 buffers of 1088*2400*4 = 0x1de9c00, aligned to
# 64 KiB -> 0x01df0000 (the atag vram field). The old 0x1f30000 was wrong.
fb_size = 0x01df0000
# 1080 rounded to 32 px = 1088 px * 4 B = 4352 (0x1100), proved from the same
# atag math. The stale 7680 (1920*4) made the fallback unusable.
fb_pitch = 4352
width = 1080
height = 2400
